name: ML-KEM HD-CPA checks

on:
  push:
    branches: ["feat/mlkem768-pwm-hd-cpa"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile source
        run: python -m compileall -q CPA.py Main.py GUI.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
