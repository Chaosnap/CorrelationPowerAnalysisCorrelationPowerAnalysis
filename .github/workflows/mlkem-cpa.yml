name: ML-KEM CPA tests
on:
  push:
    branches: [feature/mlkem-768-coefficient-cpa]
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install numpy matplotlib
      - name: Test coefficient CPA models
        run: python -m unittest discover -s tests -v
      - name: Check synthetic demo CLI
        env:
          MPLBACKEND: Agg
        run: |
          python examples/make_synthetic_demo.py
          python Main.py --cli synthetic_mlkem_cpa.npz --coeff 0 --model HW
